[workspace]
members = [
  "crates/coderelay-core",
  "crates/coderelay-protocol",
  "crates/coderelay-cli",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/coderelay-core",
  "crates/coderelay-protocol",
  "crates/coderelay-cli",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/GeWu-academy/coderelay"

[workspace.dependencies]
coderelay-core = { path = "crates/coderelay-core" }
coderelay-protocol = { path = "crates/coderelay-protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
