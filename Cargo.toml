[workspace]
members = [
  "crates/coderelay-core",
  "crates/coderelay-protocol",
  "crates/coderelay-cli",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/coderelay-core",
  "crates/coderelay-protocol",
  "crates/coderelay-cli",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/GeWu-academy/coderelay"

[workspace.dependencies]
coderelay-core = { path = "crates/coderelay-core" }
coderelay-protocol = { path = "crates/coderelay-protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
regex = "1"
dirs = "6"
tempfile = "3"
futures = "0.3"
wait-timeout = "0.2"
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "signal", "fs"] }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.9"
thiserror = "2"
