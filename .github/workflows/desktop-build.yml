name: Desktop Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS DMG (Universal, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build DMG
        working-directory: apps/desktop
        run: |
          echo "::warning title=Unsigned macOS build::This DMG is unsigned. See README for local ad-hoc signing instructions."
          bunx tauri build --ci --no-sign --target universal-apple-darwin --bundles dmg

      - name: Collect and verify unsigned DMG
        run: |
          mkdir -p artifacts
          find target apps/desktop/src-tauri/target -type f -name '*.dmg' -path '*/bundle/dmg/*' -exec cp {} artifacts/ \; 2>/dev/null || true
          DMG=$(find artifacts -type f -name '*.dmg' -print -quit)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG was produced."
            exit 1
          fi
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: coderelay-macos-universal-unsigned-${{ github.sha }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Optional base64-encoded Authenticode PFX. A locally generated self-signed
      # certificate is not trusted by users' machines; use a CA-issued certificate.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure optional Authenticode signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Warning "WINDOWS_CERTIFICATE is not configured; the installer will be unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "coderelay-authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $certificate = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $certificate) {
              throw "The PFX does not contain a certificate with a private key."
            }

            $config = [ordered]@{
              bundle = [ordered]@{
                windows = [ordered]@{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = "https://timestamp.digicert.com"
                  tsp = $true
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content -Path "apps/desktop/src-tauri/tauri.windows.conf.json" -Value $config -Encoding utf8 -NoNewline
            Write-Host "Configured Authenticode signing with certificate $($certificate.Thumbprint)."
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: bunx tauri build --ci --bundles nsis

      - name: Collect and verify installer
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $searchRoots = @("target", "apps/desktop/src-tauri/target") | Where-Object { Test-Path $_ }
          $installers = Get-ChildItem -Path $searchRoots -Recurse -File -Filter *.exe |
            Where-Object { $_.DirectoryName -like '*\bundle\nsis' }
          if (-not $installers) {
            throw "No NSIS installer was produced."
          }
          $installers | Copy-Item -Destination $artifactDir -Force

          foreach ($installer in Get-ChildItem -Path $artifactDir -File -Filter *.exe) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            Write-Host "$($installer.Name): $($signature.Status)"
            if ($env:WINDOWS_CERTIFICATE -and $signature.Status -eq "NotSigned") {
              throw "Authenticode signing was requested, but $($installer.Name) is not signed."
            }
            if ($env:WINDOWS_CERTIFICATE -and $signature.Status -ne "Valid") {
              Write-Warning "Authenticode status is $($signature.Status); users may still see an unknown publisher warning."
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: coderelay-windows-nsis-${{ github.sha }}
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
