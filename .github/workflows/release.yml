name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and existing release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version // empty' package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json contains an invalid version: ${VERSION:-<empty>}"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${TAG}."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "Version ${VERSION} already points to ${TAG}; package.json was updated without a version bump, so no release is needed."
                exit 0
              fi
              echo "::error::Tag ${TAG} points to ${TAG_COMMIT}, not ${GITHUB_SHA}. Bump package.json before releasing this commit."
              exit 1
            fi
          fi

          if gh release view "$TAG" --json assets >/dev/null 2>&1; then
            DMG_COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".dmg"))] | length')
            EXE_COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".exe"))] | length')
            DEB_COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".deb"))] | length')
            APPIMAGE_COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".AppImage"))] | length')
            if [[ "$DMG_COUNT" -gt 0 && "$EXE_COUNT" -gt 0 && "$DEB_COUNT" -gt 0 && "$APPIMAGE_COUNT" -gt 0 ]]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} already contains macOS, Windows, and Linux assets; skipping."
              exit 0
            fi
            echo "::warning::Release ${TAG} exists but is missing desktop assets; rebuilding."
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  build:
    needs: [prepare, verify]
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: coderelay-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          find release-assets -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
